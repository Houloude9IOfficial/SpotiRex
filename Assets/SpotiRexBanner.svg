<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
  <title id="title">SpotiRex</title>
  <desc id="desc">Your music, beautifully in view. A dark banner with a colorful circular ribbon.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101620"/>
      <stop offset="1" stop-color="#080d14"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#164b59" stop-opacity=".52"/>
      <stop offset="1" stop-color="#164b59" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ribbon" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#21ced1"/>
      <stop offset=".35" stop-color="#3f9fe0"/>
      <stop offset=".69" stop-color="#fa8b6d"/>
      <stop offset="1" stop-color="#f5c67a"/>
    </linearGradient>
    <linearGradient id="softRibbon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#21ced1" stop-opacity=".52"/>
      <stop offset=".55" stop-color="#5981d5" stop-opacity=".45"/>
      <stop offset="1" stop-color="#f79a71" stop-opacity=".5"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="22"/></filter>
    <clipPath id="frame"><rect width="1200" height="480" rx="28"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="480" fill="url(#background)"/>
    <ellipse cx="970" cy="250" rx="400" ry="370" fill="url(#glow)"/>
    <path d="M0 479H1200" stroke="#21323e" stroke-opacity=".55"/>
    <path d="M70 111h63" stroke="url(#ribbon)" stroke-width="4" stroke-linecap="round"/>
    <text x="70" y="205" fill="#f7f8f9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="94" font-weight="700" letter-spacing="-4">SpotiRex</text>
    <text x="73" y="273" fill="#c0c9ce" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="34" font-weight="400" letter-spacing="-.3">Your music, beautifully in view.</text>
    <text x="73" y="375" fill="#84959e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="18" font-weight="600" letter-spacing="4">NOW PLAYING FOR MAC</text>
    <circle cx="970" cy="238" r="154" fill="none" stroke="url(#ribbon)" stroke-width="78" opacity=".23" filter="url(#blur)"/>
    <circle cx="970" cy="238" r="154" fill="none" stroke="url(#softRibbon)" stroke-width="78"/>
    <circle cx="970" cy="238" r="154" fill="none" stroke="url(#ribbon)" stroke-width="44"/>
    <circle cx="970" cy="238" r="114" fill="#0b121a"/>
    <circle cx="970" cy="238" r="190" fill="none" stroke="#8bdad6" stroke-opacity=".12" stroke-width="1"/>
  </g>
</svg>
